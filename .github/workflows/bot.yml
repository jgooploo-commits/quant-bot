name: Monthly S&P 500 Quant Scanner (P1)

on:
  schedule:
    # รันทุกวันที่ 1 ของเดือน เวลา 00:30 UTC (07:30 เช้า เวลาไทย)
    # BME = Business Month End → ดีกว่ากำหนดวันที่ 28-31 (ไม่ครบทุกเดือน)
    - cron: '30 0 1 * *'
  workflow_dispatch:   # กดรันเองได้ตลอดเวลา (สำหรับทดสอบ)

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            yfinance \
            pandas \
            numpy \
            requests \
            lxml \
            html5lib \
            beautifulsoup4

      - name: Run P1 Quant Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py

      - name: Upload Log
        if: always()   # อัปโหลด log ไม่ว่า success หรือ fail
        uses: actions/upload-artifact@v4
        with:
          name: scanner-log-${{ github.run_number }}
          path: |
            quant_pipeline.log
          if-no-files-found: ignore   # ไม่ error ถ้าไม่มี log file
          retention-days: 14
