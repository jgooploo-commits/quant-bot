name: Weekly S&P 500 Scanner

on:
  schedule:
    # รันทุกวันศุกร์ เวลา 23:00 UTC (ซึ่งตรงกับ เช้าวันเสาร์ 06:00 น. เวลาประเทศไทย)
    - cron: '0 23 * * 5'
  workflow_dispatch: # ทำให้เรามีปุ่มกดสั่งรันเองได้ตลอดเวลา

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests lxml html5lib

      - name: Run Quant Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py
